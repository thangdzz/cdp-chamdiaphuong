name: Ingest scan results

# Routine quét hằng ngày (chạy trên môi trường bị chặn gọi thẳng tới web) ghi kết quả
# tìm được vào data/pending-scan.json qua GitHub Contents API. File này thay đổi ->
# workflow này tự chạy trên hạ tầng GitHub (không bị chặn mạng) -> gọi vào
# /api/ingest/submit -> web tự lọc trùng/mâu thuẫn như mọi nguồn khác.
# Xem docs/DECISIONS.md (2026-08-04) để biết vì sao chọn cách này.

on:
  push:
    branches: [main]
    paths:
      - "data/pending-scan.json"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gửi kết quả quét vào web
        id: send
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          FILE="data/pending-scan.json"

          if [ ! -s "$FILE" ]; then
            echo "File rỗng hoặc không tồn tại, không có gì để gửi."
            exit 0
          fi

          RECORDS=$(cat "$FILE")
          COUNT=$(echo "$RECORDS" | jq 'length' 2>/dev/null || echo "invalid")

          if [ "$COUNT" = "invalid" ]; then
            echo "data/pending-scan.json không phải JSON hợp lệ, dừng lại (không xoá file để giữ nguyên chờ kiểm tra)."
            exit 1
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "Mảng records rỗng, không có gì để gửi."
            exit 0
          fi

          BODY=$(jq -n --argjson records "$RECORDS" '{records: $records}')

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://web-five-xi-28.vercel.app/api/ingest/submit" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          if [ "$STATUS" != "200" ]; then
            echo "Gửi thất bại, mã HTTP: $STATUS — giữ nguyên file để thử lại lần sau."
            exit 1
          fi

          echo "sent=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.send.outputs.sent == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài đúng gói cần cho script xuất snapshot (bỏ devDependencies — không cần Playwright)
        if: steps.send.outputs.sent == 'true'
        working-directory: web
        run: npm ci --omit=dev

      - name: Xuất lại known-places-snapshot.json từ dữ liệu mới nhất
        if: steps.send.outputs.sent == 'true'
        working-directory: web
        env:
          # Chỉ token CHỈ-ĐỌC — repo Public, không được để lộ token có quyền ghi.
          # Tên biến giữ nguyên KV_REST_API_TOKEN (đúng tên code đang đọc), giá trị dán vào
          # secret là token read-only (xem docs/ROUTINE.md).
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/export-known-places.mjs

      - name: Xoá pending-scan.json + commit snapshot mới (1 commit)
        if: steps.send.outputs.sent == 'true'
        run: |
          echo "[]" > data/pending-scan.json
          git config user.name "cdp-ingest-bot"
          git config user.email "actions@github.com"
          git add data/pending-scan.json web/data/known-places-snapshot.json
          git diff --cached --quiet && echo "Không có gì thay đổi" || git commit -m "chore: xoa pending-scan.json + cap nhat known-places-snapshot.json sau ingest [skip ci]"
          git push
