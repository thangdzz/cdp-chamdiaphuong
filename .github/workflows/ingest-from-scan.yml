name: Ingest scan results

# Routine quét hằng ngày (chạy trên môi trường bị chặn gọi thẳng tới web) ghi kết quả
# tìm được vào data/pending-scan.json qua GitHub Contents API. File này thay đổi ->
# workflow này tự chạy trên hạ tầng GitHub (không bị chặn mạng) -> gọi vào
# /api/ingest/submit -> web tự lọc trùng/mâu thuẫn như mọi nguồn khác.
# Xem docs/DECISIONS.md (2026-08-04) để biết vì sao chọn cách này.

on:
  push:
    branches: [main]
    paths:
      - "data/pending-scan.json"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gửi kết quả quét vào web
        id: send
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          FILE="data/pending-scan.json"

          if [ ! -s "$FILE" ]; then
            echo "File rỗng hoặc không tồn tại, không có gì để gửi."
            exit 0
          fi

          RECORDS=$(cat "$FILE")
          COUNT=$(echo "$RECORDS" | jq 'length' 2>/dev/null || echo "invalid")

          if [ "$COUNT" = "invalid" ]; then
            echo "data/pending-scan.json không phải JSON hợp lệ, dừng lại (không xoá file để giữ nguyên chờ kiểm tra)."
            exit 1
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "Mảng records rỗng, không có gì để gửi."
            exit 0
          fi

          BODY=$(jq -n --argjson records "$RECORDS" '{records: $records}')

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://web-five-xi-28.vercel.app/api/ingest/submit" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          if [ "$STATUS" != "200" ]; then
            echo "Gửi thất bại, mã HTTP: $STATUS — giữ nguyên file để thử lại lần sau."
            exit 1
          fi

          echo "sent=true" >> "$GITHUB_OUTPUT"

      - name: Xoá nội dung file sau khi gửi thành công (tránh gửi trùng lần sau)
        if: steps.send.outputs.sent == 'true'
        run: |
          echo "[]" > data/pending-scan.json
          git config user.name "cdp-ingest-bot"
          git config user.email "actions@github.com"
          git add data/pending-scan.json
          git diff --cached --quiet && echo "Không có gì thay đổi" || git commit -m "chore: clear pending-scan.json after ingest [skip ci]"
          git push
